<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Курсач.css">
    <title>Document</title>
</head>
<body>

    <div class="game">
    <h1>УГАДАЙ ЧИСЛО</h1>
    <p>Я загадал число от 1 до 100. Попробуй угадать!</p>
    
    <input type="text" id="playerName" placeholder="Ваше имя" style="width: 100%; margin-bottom: 15px;">
    <input type="text" id="guessInput" placeholder="Введите число">
    <button id="guessBtn">Проверить</button>
    <button id="newGameBtn">Новая игра</button>
    
    <div class="log" id="log">
        <p>Введите имя и начните игру!</p>
    </div>
    
    <div class="records">
        <h3>ТАБЛИЦА РЕКОРДОВ</h3>
        <table id="recordsTable">
            <thead><tr><th>Имя</th><th>Попытки</th><th>Дата</th></tr></thead>
            <tbody id="recordsBody"><tr><td colspan="3">Нет рекордов</td></tr></tbody>
        </table>
        <button id="clearRecordsBtn" style="margin-top: 20px; width: 100%;">Очистить рекорды</button>
    </div>
</div>

    </div>
    <script src="/index.js"></script>
</body>
</html>
